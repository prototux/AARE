syntax="proto2";

import "aap_protobuf/service/media/shared/message/UiTheme.proto";
import "aap_protobuf/service/media/shared/message/Insets.proto";
import "aap_protobuf/service/media/shared/message/UiAction.proto";

package aap_protobuf.service.media.shared.message;

message UiConfig {
  optional Insets margins = 1;
  optional Insets content_insets = 2;
  optional Insets stable_content_insets = 3;
  optional UiTheme ui_theme = 4;
  // Fields 5-8. Field names are AARE's, after the protocol's own
  // classes (display UI features, cutouts, blended UI config).
  // UI elements the head unit draws itself.
  repeated UiElement ui_elements = 5;
  repeated SupportedUiAction supported_actions = 6;
  repeated DisplayCutout cutouts = 7;
  optional BlendedUiConfig blended_ui_config = 8;
}

enum UiElement {
  UI_ELEMENT_UNKNOWN = 0;
  UI_ELEMENT_CLOCK = 1;
  UI_ELEMENT_BATTERY_LEVEL = 2;
  UI_ELEMENT_PHONE_SIGNAL = 3;
  UI_ELEMENT_NATIVE_UI_AFFORDANCE = 4;
  UI_ELEMENT_NAVIGATION_TURN_DATA_AVAILABLE = 5;
}

message SupportedUiAction {
  optional UiAction action = 1;
}

// Edges in pixels; same field numbers as Insets.
message UiRect {
  optional uint32 top = 1;
  optional uint32 bottom = 2;
  optional uint32 left = 3;
  optional uint32 right = 4;
}

message DisplayCutout {
  optional UiRect bounds = 1;
}

message BlendedUiConfig {
  optional CornerRadii window_corner_radii = 1;
  repeated NativeUiElement native_ui_elements = 2;
}

message CornerRadii {
  optional uint32 top_left = 1;
  optional uint32 top_right = 2;
  optional uint32 bottom_left = 3;
  optional uint32 bottom_right = 4;
}

message NativeUiElement {
  optional UiRect position = 1;
  // An enum: 0 unknown (it drops the element), 1-3 element types it doesn't
  // name.
  optional int32 element_type = 2;
}