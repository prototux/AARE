syntax="proto2";

package aap_protobuf.service.media.sink;

enum MediaMessageId
{
    MEDIA_MESSAGE_DATA = 0;
    MEDIA_MESSAGE_CODEC_CONFIG = 1;
    MEDIA_MESSAGE_SETUP = 32768;
    MEDIA_MESSAGE_START = 32769;
    MEDIA_MESSAGE_STOP = 32770;
    MEDIA_MESSAGE_CONFIG = 32771;
    MEDIA_MESSAGE_ACK = 32772;
    MEDIA_MESSAGE_MICROPHONE_REQUEST = 32773;
    MEDIA_MESSAGE_MICROPHONE_RESPONSE = 32774;
    MEDIA_MESSAGE_VIDEO_FOCUS_REQUEST = 32775;
    MEDIA_MESSAGE_VIDEO_FOCUS_NOTIFICATION = 32776;
    MEDIA_MESSAGE_UPDATE_UI_CONFIG_REQUEST = 32777;
    MEDIA_MESSAGE_UPDATE_UI_CONFIG_REPLY = 32778;
    MEDIA_MESSAGE_AUDIO_UNDERFLOW_NOTIFICATION = 32779;
    // AARE: 0x800C-0x8015. Directions and bodies as used:
    // phone -> head unit: ACTION_TAKEN (ActionTakenNotification), INTEGRATED_OVERLAY_PARAMETERS
    // (IntegratedOverlayParametersNotification), UPDATE_HU_UI_CONFIG_REQUEST
    // (UpdateHuUiConfigRequest), MEDIA_OPTIONS (MediaOptions), CRITICAL_UI
    // (CriticalUiNotification).
    // head unit -> phone: INTEGRATED_OVERLAY_START (IntegratedOverlayStartNotification),
    // INTEGRATED_OVERLAY_STOP (body not read), UPDATE_HU_UI_CONFIG_RESPONSE
    // (UpdateHuUiConfigResponse), MEDIA_STATS (MediaStats). INTEGRATED_OVERLAY_SESSION_DATA_UPDATE
    // is named but not used.
    MEDIA_MESSAGE_ACTION_TAKEN_NOTIFICATION = 32780;
    MEDIA_MESSAGE_INTEGRATED_OVERLAY_PARAMETERS_NOTIFICATION = 32781;
    MEDIA_MESSAGE_INTEGRATED_OVERLAY_START_NOTIFICATION = 32782;
    MEDIA_MESSAGE_INTEGRATED_OVERLAY_STOP_NOTIFICATION = 32783;
    MEDIA_MESSAGE_INTEGRATED_OVERLAY_SESSION_DATA_UPDATE = 32784;
    MEDIA_MESSAGE_UPDATE_HU_UI_CONFIG_REQUEST = 32785;
    MEDIA_MESSAGE_UPDATE_HU_UI_CONFIG_RESPONSE = 32786;
    MEDIA_MESSAGE_MEDIA_STATS = 32787;
    MEDIA_MESSAGE_MEDIA_OPTIONS = 32788;
    MEDIA_MESSAGE_CRITICAL_UI_NOTIFICATION = 32789;
}
