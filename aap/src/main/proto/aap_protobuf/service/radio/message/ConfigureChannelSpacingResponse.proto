syntax="proto2";

option optimize_for=SPEED;

import "aap_protobuf/shared/MessageStatus.proto";

package aap_protobuf.service.radio.message;

message ConfigureChannelSpacingResponse {
  optional shared.MessageStatus status = 1 [default = STATUS_SUCCESS];
  optional int32 radio_id = 2;
  optional int32 channel_spacing = 3;
}