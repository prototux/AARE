syntax="proto2";

package aap_protobuf.service.navigationstatus;

message NavigationStatusService {
    optional int32 minimum_interval_ms = 1;

    // AARE: required -> optional (wire-identical): an unknown cluster type must not fail service
    // discovery. Readers check hasType().
    optional InstrumentClusterType type = 2;
    enum InstrumentClusterType {
        IMAGE = 1;
        ENUM = 2;
    }

    optional ImageOptions image_options = 3;
    message ImageOptions {
        optional int32 height = 1;
        optional int32 width = 2;
        optional int32 colour_depth_bits = 3;
    }
}