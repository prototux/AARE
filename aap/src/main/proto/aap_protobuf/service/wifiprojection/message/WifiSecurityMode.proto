syntax="proto2";

option optimize_for=SPEED;

package aap_protobuf.service.wifiprojection.message;

enum WifiSecurityMode {
  UNKNOWN_SECURITY_MODE = 0;
  OPEN = 1;
  WEP_64 = 2;
  WEP_128 = 3;
  WPA_PERSONAL = 4;
  WPA2_PERSONAL = 5;
  WPA_WPA2_PERSONAL = 6;
  WPA_ENTERPRISE = 7;
  WPA2_ENTERPRISE = 8;
  WPA_WPA2_ENTERPRISE = 9;
  // 0-11 are accepted here. The names of 10 and 11 are AARE's guess, after the WPA3
  // modes that follow WPA_WPA2_ENTERPRISE in the Wi-Fi security list.
  WPA3_PERSONAL = 10;
  WPA2_WPA3_PERSONAL = 11;
}