syntax="proto2";

package aap_protobuf.service.control.message;

import "aap_protobuf/service/control/message/ConnectionConfiguration.proto";

// AARE: appends this to its VERSION_RESPONSE (after major, minor
// and status) only when a setting of its own is on and the head unit is new enough, to give the
// head unit its ping configuration. AARE doesn't send it.
message VersionResponseOptions {
  optional ConnectionConfiguration connection_configuration = 1;
}

