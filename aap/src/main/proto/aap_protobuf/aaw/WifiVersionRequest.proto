syntax="proto2";

package aap_protobuf.aaw;

// AARE: fields from open-headunit's wireless.proto (decoded from Gearhead 17.5/17.8); aasdk's copy
// was empty. wpp_info offers WPP over TCP (see docs/decisions.md).
message WifiVersionRequest {
  optional int32 major = 1;
  optional int32 minor = 2;
  // 0 5 GHz only, 1 2.4 GHz only, 2 dual band, 3 none
  optional int32 supported_wifi_channel_type = 3;
  repeated int32 supported_wifi_channels = 4 [packed = true];
  optional WppCarInfo car_info = 5;
  optional WifiProjectionProtocolInfo wpp_info = 6;
}

// AARE: from open-headunit's wireless.proto. Fields 5-8 are its best guess.
message WppCarInfo {
  optional string make = 1;
  optional string model = 2;
  optional string model_year = 3;
  optional string vehicle_id = 4;
  optional string head_unit_make = 5;
  optional string head_unit_model = 6;
  optional string head_unit_software_build = 7;
  optional string head_unit_software_version = 8;
}

// AARE: from open-headunit's wireless.proto: where the head unit serves WPP over TCP.
message WifiProjectionProtocolInfo {
  optional string ip_address = 1;
  optional int32 port = 2;
}
