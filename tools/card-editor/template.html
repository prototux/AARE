<!doctype html>
<!--
  AARE's card editor: draws dashboard cards (docs/custom-cards.md) on a computer, in any browser,
  with nothing to install and nothing sent anywhere. Built by build.py from template.html, words.txt
  and the app's own designs and icons: edit those, not index.html.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AARE card editor</title>
<style>
/*FONT*/
:root { color-scheme: dark; --bg:#0b0f0f; --panel:#141a19; --raised:#1d2524; --line:#2e3836; --text:#e3e9e7; --dim:#afbab7; --accent:#3ddbc6; --on-accent:#00201c; --bad:#ff8a80; }
* { box-sizing:border-box; }
html,body { height:100%; margin:0; }
body { background:var(--bg); color:var(--text); font:14px/1.4 Roboto,"Noto Sans",Arial,sans-serif; display:flex; flex-direction:column; }
button,input,select,textarea { font:inherit; color:inherit; background:var(--raised); border:1px solid var(--line); border-radius:8px; padding:6px 10px; min-width:0; }
button { cursor:pointer; white-space:nowrap; }
button:hover:not(:disabled) { border-color:var(--accent); }
button:disabled { opacity:.4; cursor:default; }
button.main { background:var(--accent); color:var(--on-accent); border-color:var(--accent); font-weight:500; }
button.on { border-color:var(--accent); color:var(--accent); }
:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
header { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); }
header h1 { font-size:16px; font-weight:500; margin:0; margin-inline-end:auto; }
main { flex:1; min-height:0; display:grid; grid-template-columns:250px minmax(0,1fr) 310px; }
aside { background:var(--panel); overflow:auto; padding:14px; }
aside:first-child { border-inline-end:1px solid var(--line); }
aside:last-child { border-inline-start:1px solid var(--line); }
h2 { font-size:13px; font-weight:500; color:var(--dim); margin:0 0 10px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
.layer { width:100%; text-align:start; display:block; overflow:hidden; text-overflow:ellipsis; margin-bottom:6px; }
.layer small { color:var(--dim); margin-inline-start:6px; }
.tools { display:flex; gap:6px; margin-bottom:12px; }
.tools button { flex:1; padding:6px 0; }
#stage { display:flex; flex-direction:column; min-height:0; min-width:0; }
.bar { display:flex; flex-wrap:wrap; gap:6px; padding:12px 14px; justify-content:center; }
.bar span { width:12px; }
#view { flex:1; min-height:120px; display:flex; align-items:center; justify-content:center; padding:10px; overflow:hidden; }
canvas { border-radius:26px; touch-action:none; cursor:grab; }
#version { text-align:center; padding:0 14px 10px; color:var(--dim); }
#note { padding:0 14px 8px; text-align:center; color:var(--bad); min-height:26px; }
details { border-top:1px solid var(--line); }
summary { padding:10px 14px; cursor:pointer; color:var(--dim); }
#json { width:100%; height:230px; border:0; border-radius:0; resize:vertical; font:12px/1.5 ui-monospace,monospace; direction:ltr; white-space:pre; display:block; }
.row { display:grid; grid-template-columns:108px minmax(0,1fr); gap:8px; align-items:center; margin-bottom:8px; }
.row > label { color:var(--dim); overflow-wrap:anywhere; }
.row input:not([type=checkbox]):not([type=color]), .row select, .row textarea { width:100%; }
.row textarea { resize:vertical; min-height:58px; }
.stack { display:flex; flex-direction:column; gap:6px; min-width:0; }
.pair { display:flex; gap:6px; align-items:center; }
.pair > * { flex:1; }
.pair input[type=color] { flex:0 0 38px; height:34px; padding:2px; }
.pair button { flex:0 0 auto; padding:6px 9px; }
.grid4 { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
input[type=number] { appearance:textfield; -moz-appearance:textfield; }
input::-webkit-inner-spin-button { display:none; }
.grid4 label { display:flex; gap:6px; align-items:center; color:var(--dim); }
.chips { display:flex; flex-wrap:wrap; gap:4px; }
.chips button { padding:2px 8px; border-radius:20px; font-size:12px; }
.chips button.not { border-color:var(--bad); color:var(--bad); text-decoration:line-through; }
.hint { color:var(--dim); margin-top:16px; font-size:13px; }
@media (max-width:900px) { body { height:auto; } main { grid-template-columns:1fr; } #stage { order:-1; } #view { min-height:260px; } }
</style>
</head>
<body>
<header>
  <h1 data-w="title"></h1>
  <select id="new"></select>
  <button id="open" data-w="open"></button>
  <button id="undo" data-w="undo"></button>
  <button id="redo" data-w="redo"></button>
  <button id="save" class="main" data-w="save"></button>
  <input type="file" id="file" accept=".json,application/json" hidden>
  <input type="file" id="picture" accept="image/png,image/jpeg,image/webp" hidden>
</header>
<main>
  <aside><h2><span data-w="layers"></span><select id="add"></select></h2><div id="layers"></div></aside>
  <section id="stage">
    <div class="bar" id="bar"></div>
    <div id="view"><canvas id="canvas" tabindex="0"></canvas></div>
    <div id="version"></div>
    <div id="note" role="status"></div>
    <details id="jsonPane"><summary>JSON</summary><textarea id="json" spellcheck="false"></textarea></details>
  </section>
  <aside id="props"></aside>
</main>
<datalist id="colors"></datalist>
<script>

function label(l) {
  const what = {text: l.text, hand: l.value && (l.value.value || l.value), arc: l.value && (l.value.value || l.value), icon: l.icon}[l.type];
  return [w(l.type), what === undefined ? '' : String(what).slice(0, 24)];
}
function layers() {
  const box = $('layers'), L = layout(); box.replaceChildren();
  $('add').disabled = !own();
  if (!own()) return;
  if (selected >= 0) box.append(el('div', {className: 'tools'},
    el('button', {textContent: '↑', title: w('forward'), ariaLabel: w('forward'), disabled: selected >= L.layers.length - 1, onclick: () => move(1)}),
    el('button', {textContent: '↓', title: w('backward'), ariaLabel: w('backward'), disabled: selected <= 0, onclick: () => move(-1)}),
    el('button', {textContent: '⧉', title: w('duplicate'), ariaLabel: w('duplicate'), onclick: () => { L.layers.splice(selected + 1, 0, JSON.parse(JSON.stringify(L.layers[selected]))); selected++; changed(); }}),
    el('button', {textContent: '✕', title: w('delete'), ariaLabel: w('delete'), onclick: remove})));
  // Topmost first, as they cover each other.
  for (let i = L.layers.length - 1; i >= 0; i--) {
    const [kind, what] = label(L.layers[i]);
    box.append(el('button', {className: 'layer' + (i === selected ? ' on' : ''), onclick: () => { selected = i === selected ? -1 : i; refresh(); }}, kind, el('small', {textContent: what})));
  }
}
function move(by) { const a = layout().layers; a.splice(selected + by, 0, a.splice(selected, 1)[0]); selected += by; changed(); }
function remove() { layout().layers.splice(selected, 1); selected = -1; changed(); }

function row(name, ...control) { return el('div', {className: 'row'}, el('label', {textContent: name}), ...control); }
const choose = (options, now, act) => { const s = el('select', {onchange: () => act(s.value)}); for (const [v, t] of options) s.append(el('option', {value: v, textContent: t, selected: v === now})); return s; };
/** A number being typed changes the card, not the fields around it. */
function number(now, hint, stepBy, act) {
  const i = el('input', {type: 'number', step: 'any', value: now ?? '', placeholder: hint ?? '', oninput: () => { if (i.value === '') act(undefined); else if (isFinite(i.valueAsNumber)) act(i.valueAsNumber); }});
  if (stepBy) i.onkeydown = e => { const d = {ArrowUp: 1, ArrowDown: -1}[e.key]; if (d) { e.preventDefault(); i.value = Math.round(((i.value === '' ? +i.placeholder || 0 : +i.value) + d * stepBy) * 1000) / 1000; i.oninput(); } };
  return i;
}
function colorField(now, act) {
  const pick = el('input', {type: 'color'}), write = el('input', {value: typeof now === 'string' ? now : '', dir: 'ltr'});
  write.setAttribute('list', 'colors');
  const show = () => { const c = color(write.value || 'onSurface'); pick.value = /^#[0-9a-f]{6}/i.test(c) ? c.slice(0, 7) : /^#[0-9a-f]{3}$/i.test(c) ? '#' + [...c.slice(1)].map(x => x + x).join('') : '#000000'; };
  show();
  pick.oninput = () => { write.value = pick.value; act(pick.value); };
  write.oninput = () => { show(); act(write.value || undefined); };
  return el('div', {className: 'pair'}, pick, write);
}
/** A colour: one, one by day and another by night, or (gradients) several. */
function paintField(now, def, gradients, act) {
  const mode = now && typeof now === 'object' ? (now.gradient ? 'gradient' : 'dayNight') : now == null && def == null ? 'none' : 'solid';
  const modes = [['solid', w('solid')], ['dayNight', w('dayNight')]];
  if (gradients) modes.push(['gradient', w('gradient')]);
  if (def == null) modes.unshift(['none', w('none')]);
  const base = typeof now === 'string' ? now : now && now.gradient ? now.gradient[0] : now && now.night ? now.night : def || 'primary';
  const box = el('div', {className: 'stack'}, choose(modes, mode, m => act(m === 'none' ? undefined : m === 'solid' ? base : m === 'dayNight' ? {day: base, night: base} : {gradient: [base, 'surface']}, true)));
  if (mode === 'solid') box.append(colorField(now ?? def, v => act(v)));
  if (mode === 'dayNight') for (const k of ['day', 'night']) box.append(colorField(now[k], v => act({...now, [k]: now[k] = v ?? base})));
  if (mode === 'gradient') {
    now.gradient.forEach((c, i) => { const f = colorField(c, v => { now.gradient[i] = v ?? base; act(now); }); if (now.gradient.length > 2) f.append(el('button', {textContent: '✕', ariaLabel: w('delete'), onclick: () => { now.gradient.splice(i, 1); act(now, true); }})); box.append(f); });
    box.append(el('div', {className: 'pair'},
      choose(['linear', 'radial', 'sweep'].map(k => [k, k]), now.kind || 'linear', v => { if (v === 'linear') delete now.kind; else now.kind = v; act(now, true); }),
      number(now.angle, 180, 15, v => { if (v === undefined) delete now.angle; else now.angle = v; act(now); }),
      el('button', {textContent: '+', ariaLabel: w('add'), disabled: now.gradient.length >= 12, onclick: () => { now.gradient.push(now.gradient[now.gradient.length - 1]); act(now, true); }})));
  }
  return box;
}
function bindingField(now, kind, act) {
  const o = typeof now === 'object' && now ? now : typeof now === 'string' ? {value: now} : null;
  const options = [...(kind === 'value' ? [] : [['', kind === 'binding' ? w('fixed') : w('none')]]), ...Object.keys(VALUES).map(v => [v, v])];
  const box = el('div', {className: 'stack'}, choose(options, o ? o.value : '', v => act(v || undefined, true)));
  if (!o) { if (kind === 'binding') box.append(number(now, 0, 5, v => act(v))); return box; }
  const ends = kind === 'fraction' ? [0, 1] : [0, 360], def = {min: VALUES[o.value]?.[0], max: VALUES[o.value]?.[1], from: ends[0], to: ends[1]};
  const grid = el('div', {className: 'grid4'});
  const cur = {...o};
  for (const k of ['min', 'max', 'from', 'to']) grid.append(el('label', {}, k, number(o[k], def[k], 0, v => { if (v === undefined) delete cur[k]; else cur[k] = v; act(Object.keys(cur).length === 1 ? cur.value : {...cur}); })));
  box.append(grid);
  return box;
}
function field(l, [k, kind, def, by]) {
  const set = (v, rebuild = false) => { if (v === undefined) delete l[k]; else l[k] = v; changed(rebuild); };
  if (k === 'rotate') def = undefined;
  if (Array.isArray(kind)) return choose(kind.map(v => [v, v]), l[k] ?? def, v => set(v === def ? undefined : v));
  switch (kind) {
    case 'num': case 'int': return number(l[k], def ?? (k === 'x' ? layout().size[0] / 2 : k === 'y' ? layout().size[1] / 2 : ''), by || 1, v => set(v));
    case 'bool': { const c = el('input', {type: 'checkbox', checked: l[k] ?? def, onchange: () => set(c.checked === def ? undefined : c.checked)}); return el('div', {}, c); }
    case 'weight': return choose(Object.keys(WEIGHTS).map(v => [v, v]), l[k] ?? def, v => set(v === def ? undefined : v));
    case 'numbers': { const list = Array.isArray(l[k]); return el('div', {className: 'stack'}, choose([...Object.keys(NUMBERS).sort().map(v => [v, v]), ['', w('list')]], list ? '' : l[k] ?? def, v => set(v || [...NUMBERS[l[k]] || NUMBERS['12']], true)),
      ...(list ? [el('input', {value: l[k].join(', '), oninput: e => set(e.target.value.split(',').map(t => t.trim()))})] : [])); }
    case 'text': {
      const t = el('textarea', {value: l[k] ?? '', spellcheck: false, oninput: () => set(t.value)});
      if (k !== 'text') return t;
      const insert = choose([['', w('insert')], ...TOKENS.map(v => [v, '{' + v + '}'])], '', v => { if (!v) return; t.setRangeText('{' + v + '}', t.selectionStart, t.selectionEnd, 'end'); insert.value = ''; t.focus(); set(t.value); });
      return el('div', {className: 'stack'}, t, insert);
    }
    case 'zone': return el('input', {value: l[k] ?? '', placeholder: 'Europe/Madrid', dir: 'ltr', oninput: e => set(e.target.value.trim() || undefined)});
    case 'paint': return paintField(l[k], l.type === 'image' ? null : def, true, set);
    case 'color': return paintField(l[k], def, false, set);
    case 'binding': case 'value': case 'fraction': return bindingField(l[k], kind, set);
    case 'picture': return el('button', {textContent: w('choosePicture'), onclick: () => choosePicture(l)});
    case 'show': {
      const now = l.show === undefined ? [] : [].concat(l.show);
      return el('div', {className: 'chips'}, ...CONDITIONS.map(c => {
        const state = now.includes(c) ? 'on' : now.includes('!' + c) ? 'not' : '';
        // Each tap: only with it, only without it, either way.
        return el('button', {textContent: c, className: state, onclick: () => { const rest = now.filter(n => n.replace('!', '') !== c), next = [...rest, ...(state === '' ? [c] : state === 'on' ? ['!' + c] : [])]; set(next.length > 1 ? next : next[0], true); }});
      }));

}
function props() {
  const box = $('props'), L = layout(); box.replaceChildren();
  if (!own()) return;
  const l = L.layers[selected];
  if (l && TYPES[l.type]) {
    box.append(el('h2', {textContent: w(l.type)}));
    for (const f of [...TYPES[l.type], ...POS, ...COMMON]) box.append(row(w(WORD[f[0]] || f[0]), field(l, f)));
    return;
  }
  box.append(el('h2', {textContent: w(shape)}));
  if (shape === 'card') {
    box.append(row(w('name'), el('input', {value: card.name ?? '', oninput: e => { card.name = e.target.value; changed(false); }})));
    box.append(row(w('author'), el('input', {value: card.author ?? '', oninput: e => { if (e.target.value) card.author = e.target.value; else delete card.author; changed(false); }})));
  }

  box.append(row(w('background'), paintField(L.background ?? undefined, null, true, (v, rebuild = false) => { if (v === undefined) delete L.background; else L.background = v; changed(rebuild); })));

}

// ------------------------------------------------------------ files
const dirty = () => last !== saved && undo.length > 0;
const sure = () => !dirty() || confirm(w('discard'));
function choosePicture(l) {
  const f = $('picture');
  f.onchange = async () => {
    const file = f.files[0]; f.value = '';
    if (!file) return;
    const bitmap = await createImageBitmap(file).catch(() => null);
    if (!bitmap) return;
    // As big as a card ever shows it, so that a photo doesn't make a file of megabytes.
    const k = Math.min(1, 800 / Math.max(bitmap.width, bitmap.height)), c = el('canvas', {width: Math.max(1, Math.round(bitmap.width * k)), height: Math.max(1, Math.round(bitmap.height * k))});
    c.getContext('2d').drawImage(bitmap, 0, 0, c.width, c.height);
    const data = c.toDataURL(file.type === 'image/jpeg' ? 'image/jpeg' : 'image/png', 0.85), L = layout();
    if (l) l.data = data;
    else {
      const fit = Math.min(1, L.size[0] / c.width, L.size[1] / c.height);
      L.layers.push({type: 'image', w: Math.round(c.width * fit), h: Math.round(c.height * fit), data}); selected = L.layers.length - 1;
    }
    changed();
  };
  f.click();
}
function save() {
  const name = (card.name || 'card').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-+|-+$/g, '') || 'card';
  const a = el('a', {href: URL.createObjectURL(new Blob([last], {type: 'application/json'})), download: name + '.json'});
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  saved = last;
}
$('save').onclick = save;
$('undo').onclick = () => step(undo, redo);
$('redo').onclick = () => step(redo, undo);
$('open').onclick = () => { if (sure()) $('file').click(); };
$('file').onchange = async () => {
  const file = $('file').files[0]; $('file').value = '';
  if (!file) return;
  try { read((await file.text()).replace(/^﻿/, '')); } catch (e) { $('note').textContent = e.message; }
};
/** A card from outside: refused whole if its shape is wrong, so what follows can rely on it. */
function read(json) {
  const c = JSON.parse(json);
  if (!c || typeof c !== 'object' || c.aareCard !== 1) throw new Error('aareCard');
  for (const l of [c, c.strip, c.tall]) if (l != null && (!Array.isArray(l.size) || l.size.length !== 2 || !Array.isArray(l.layers) || l.layers.some(o => !o || typeof o !== 'object' || !(o.type in TYPES)))) throw new Error('size, layers');
  load(json, true);
}
$('json').oninput = () => {
  let c;
  try { c = JSON.parse($('json').value); } catch (e) { $('note').textContent = e.message; return; }
  const bad = !c || typeof c !== 'object' ? 'JSON' : check(c);
  if (bad) { $('note').textContent = bad; return; }
  card = c; selected = -1; if (shape !== 'card' && !card[shape]) shape = 'card';
  changed();
};
$('json').onblur = () => refresh();
window.onbeforeunload = e => { if (dirty()) e.preventDefault(); };
window.onresize = draw;

const add = $('add');
add.append(el('option', {value: '', textContent: w('add')}), ...Object.keys(TYPES).map(t => el('option', {value: t, textContent: w(t)})));
add.onchange = () => {
  const type = add.value; add.value = '';
  if (type === 'image') return choosePicture(null);
  const L = layout();
  L.layers.push(fresh(type, ...L.size)); selected = L.layers.length - 1; changed();
};
const start = $('new');
const BLANK = {aareCard: 1, name: w('blankName'), size: [400, 240], layers: []};
start.append(el('option', {value: '', textContent: w('new')}), el('option', {value: 'blank', textContent: w('blank')}), ...Object.keys(DESIGNS).map(d => el('option', {value: d, textContent: w('face_' + d)})));
start.onchange = () => {
  const id = start.value; start.value = '';
  if (!id || !sure()) return;
  load(JSON.stringify(id === 'blank' ? BLANK : {...DESIGNS[id], name: w('blankName')}), true);
};
$('colors').append(...Object.keys(THEME.night).map(c => el('option', {value: c})));

let draft = null;
try { draft = localStorage.getItem('aare-card'); } catch (e) { /* none */ }
try { if (!draft) throw 0; read(draft); } catch (e) { load(JSON.stringify({...DESIGNS.weather, name: w('blankName')}), true); }
setInterval(() => { if (!drag) draw(); }, 1000);
document.fonts && document.fonts.load('20px DSEG7').then(draw);
